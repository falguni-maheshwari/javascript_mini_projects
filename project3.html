<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
}

.container{
  width:400px;
  background:#1e1e1e;
  padding:30px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(0,255,255,0.2);
  color:white;
}

h1{
  text-align:center;
  margin-bottom:25px;
  color:#00ffff;
}

.input-box{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  padding:15px;
  border:none;
  border-radius:10px;
  outline:none;
  font-size:16px;
}

button{
  padding:15px 20px;
  border:none;
  border-radius:10px;
  background:#00ffff;
  color:black;
  cursor:pointer;
  font-size:16px;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

ul{
  margin-top:25px;
  list-style:none;
}

li{
  background:#2a2a2a;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.completed{
  text-decoration:line-through;
  opacity:0.6;
}

.deleteBtn{
  background:red;
  color:white;
  padding:8px 12px;
  font-size:14px;
}
</style>
<body>
    <div class="conatiner">
        <h1>Todo List</h1>
        <div class="input-box">
            <input type="text" id="taskInput"
            placeholder="Enter task" >
            <button id="addBtn">add</button>

        </div>
        <ul id="taskList"></ul>
    </div>
</body>
</html>
<script>
let addbtn=document.getElementById("addbtn");
let taskInput=document.getElementById("taskInput");
let tasklist=document.getElementById("taskList");
addBtn.addEventListener("click",function(){
    let taskText = taskInput.value;

  if(taskText === ""){
    alert("Please enter task");
    return;
  }

  let li = document.createElement("li");

  li.innerHTML =
  `
  <span>${taskText}</span>

  <button class="deleteBtn">
    Delete
  </button>
  `;

  taskList.appendChild(li);

  taskInput.value = "";

  li.addEventListener("click", function(){

    li.classList.toggle("completed");

  });

  let deleteBtn =
  li.querySelector(".deleteBtn");

  deleteBtn.addEventListener("click",
  function(){

    li.remove();

  });

});


</script>
