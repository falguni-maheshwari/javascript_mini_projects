<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
}

.container{
  background:#1e1e1e;
  padding:40px;
  border-radius:20px;
  text-align:center;
  color:white;
  width:350px;
  box-shadow:0 0 20px rgba(0,255,255,0.2);
}

h1{
  margin-bottom:30px;
}

#count{
  font-size:80px;
  margin-bottom:30px;
  color:#00ffff;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:15px;
}

button{
  padding:15px 25px;
  border:none;
  border-radius:10px;
  background:#00ffff;
  color:black;
  font-size:20px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}
</style>

<body>
    <div class="container">
        <h1>Counter app</h1>
        <div id="count">0</div>
         <div class="buttons">

    <button id="decrease">
      -
    </button>

    <button id="reset">
      Reset
    </button>

    <button id="increase">
      +
    </button>

  </div>

    </div>
    
</body>
</html>

<script>
let count = 0;

let counttext = document.getElementById("count");

let insbtn = document.getElementById("increase");

let decrbtn = document.getElementById("decrease");

let resetbtn = document.getElementById("reset");

insbtn.addEventListener("click", function(){

    count++;

    counttext.innerText = count;

});

decrbtn.addEventListener("click", function(){

    count--;

    counttext.innerText = count;

});

resetbtn.addEventListener("click", function(){

    count = 0;

    counttext.innerText = count;

});


</script>
