<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<STYLE>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
}

.clock-container{
  background:#1e1e1e;
  padding:40px;
  border-radius:20px;
  text-align:center;
  color:white;
  width:400px;
  box-shadow:0 0 20px rgba(0,255,255,0.2);
}

h1{
  margin-bottom:30px;
}

#clock{
  font-size:60px;
  color:#00ffff;
  font-weight:bold;
}
</STYLE>
<body>
    <div class="clock-container">
        <h1>Digital Clock</h1>
        <div id="clock">
            00:00:00
        </div>
    </div>
</body>
</html>
<script>
function updateClock(){

    let now = new Date();

    let hours = now.getHours();

    let minutes = now.getMinutes();

    let seconds = now.getSeconds();

    let ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;

    if(hours == 0){
        hours = 12;
    }

    if(hours < 10){
        hours = "0" + hours;
    }

    if(minutes < 10){
        minutes = "0" + minutes;
    }

    if(seconds < 10){
        seconds = "0" + seconds;
    }

    let time =
    hours + ":" +
    minutes + ":" +
    seconds + " " +
    ampm;

    document.getElementById("clock")
    .innerText = time;

}

setInterval(updateClock,1000);

updateClock();

</script>
